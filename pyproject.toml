[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vooy-gallery"
version = "0.1.0"
description = "BTS photo retrieval with OpenAI captions, text embeddings and MCP"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1", "numpy>=2.2,<3", "Pillow>=11,<13",
  "ImageHash>=4.3,<5", "openai>=2,<3", "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2", "mcp>=1.20,<2",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1", "beautifulsoup4>=4.12,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12"]

[project.scripts]
gallery = "vooy_gallery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vooy_gallery = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 110
